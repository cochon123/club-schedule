<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club calendar | Unnatural Intelligence</title>
<style>
:root{color-scheme:light;--paper:#f9f9fa;--ink:#030205;--lime:#baf837;--plum:#591337;--salmon:#faa49e;--olive:#6c842e;--line:#d8d6d7}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--plum);outline-offset:3px}.shell{max-width:1160px;margin:auto;padding:0 28px}.top{background:var(--plum);color:white}.top .shell{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;color:inherit;text-decoration:none;letter-spacing:-.03em}.brand span{color:var(--lime)}.top a:not(.brand){color:white;font-size:.9rem}.intro{padding:52px 0 34px;display:flex;justify-content:space-between;align-items:end;gap:24px}.intro h1{font-size:clamp(2.7rem,7vw,5.3rem);line-height:.95;letter-spacing:-.065em;margin:0 0 16px}.intro p{margin:0;color:#51474c;max-width:50ch}.stamp{background:var(--lime);color:var(--ink);padding:18px 22px;max-width:210px;border-radius:50% 46% 42% 48%;font-weight:750;transform:rotate(4deg);text-align:center}.tools{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.nav,.views{display:flex;align-items:center;gap:8px}.nav h2{font-size:1.25rem;min-width:170px;text-align:center;margin:0}.btn{border:1px solid #bdb5ba;background:white;color:var(--ink);border-radius:8px;padding:8px 13px;font-weight:650}.btn:hover{border-color:var(--plum)}.btn[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:white}.arrows{font-size:1.3rem;line-height:1}.calendar{padding:22px 0}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{color:#5b4e55;font-size:.83rem;font-weight:700}.weekdays span{padding:8px}.grid{border-left:1px solid var(--line);border-top:1px solid var(--line)}.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;background:white}.day.outside{background:#f0eff0;color:#777}.day-num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:.9rem;font-weight:700}.today .day-num{background:var(--plum);color:white;border-radius:50%}.event{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--plum);background:#f5edf1;color:var(--ink);padding:6px 8px;margin-top:5px;border-radius:0 5px 5px 0;font-size:.79rem;line-height:1.25;overflow-wrap:anywhere}.event.pending{border-left-color:var(--olive);background:#eef3df}.event:hover{text-decoration:underline}.event small{display:block;margin-top:3px;color:#534d50}.list{display:grid;gap:0}.list-row{display:grid;grid-template-columns:105px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}.list-date{font-weight:800;color:var(--plum)}.list-row .event{font-size:1rem;margin:0;padding:12px}.empty{padding:35px 0;color:#5b4e55}.tba{border-top:2px solid var(--ink);padding:20px 0 38px}.tba h2{font-size:1.3rem;margin:0 0 10px}.tba .event{max-width:580px}footer{background:#ece9eb;padding:24px 0;color:#51474c;font-size:.9rem}footer a{color:var(--plum)}dialog{border:0;border-radius:14px;box-shadow:0 16px 70px #0005;max-width:570px;width:calc(100% - 32px);padding:28px;color:var(--ink)}dialog::backdrop{background:#1f101baa}dialog h2{font-size:1.7rem;line-height:1.15;letter-spacing:-.03em;margin:18px 0}dialog p{white-space:pre-wrap}dialog .close{float:right}.status{display:inline-block;background:#ecf2da;border-radius:4px;padding:3px 8px;font-size:.83rem;font-weight:700}.media a{display:block;color:var(--plum);overflow-wrap:anywhere}.media img{max-width:100%}.notice{color:#51474c} @media(max-width:700px){.shell{padding:0 17px}.intro{padding:38px 0 25px}.stamp{display:none}.nav h2{min-width:145px;font-size:1.1rem}.day{min-height:75px;padding:3px}.weekdays span{padding:5px;font-size:.7rem}.event{font-size:.7rem;padding:4px}.event small{display:none}.top .shell{min-height:62px}.list-row{grid-template-columns:75px 1fr;gap:10px}}@media(max-width:440px){.day{min-height:62px}.grid .event{font-size:0;height:8px;padding:0;border:0;border-radius:4px;background:var(--plum)}.grid .event.pending{background:var(--olive)}.grid .event:focus-visible{height:auto;font-size:.75rem;padding:4px}.day-num{width:25px;height:25px}.nav h2{min-width:128px}.btn{padding:7px 10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="shell"><a class="brand" href="https://unnaturalintelligence.club">Unnatural <span>Intelligence</span></a><a href="https://unnaturalintelligence.club">Club website</a></div></header>
<main class="shell"><section class="intro"><div><h1>What's on.</h1><p>Workshops, experiments and meetups from the Unnatural Intelligence club at SAIT.</p></div><div class="stamp" aria-hidden="true">Create.<br>Learn. Build.</div></section>
<section aria-label="Club calendar"><div class="tools"><div class="nav"><button class="btn arrows" id="prev" aria-label="Previous month">‹</button><h2 id="month" aria-live="polite"></h2><button class="btn arrows" id="next" aria-label="Next month">›</button><button class="btn" id="today">Today</button></div><div class="views" aria-label="Calendar view"><button class="btn" id="calendar-view" aria-pressed="true">Calendar</button><button class="btn" id="list-view" aria-pressed="false">List</button></div></div>
<div id="error" class="empty" role="alert" hidden></div><div class="calendar"><div id="calendar"><div class="weekdays" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="grid" id="grid"></div></div><div id="list" class="list" hidden></div></div><section class="tba" id="tba" hidden><h2>Date to be announced</h2><div id="tba-list"></div></section></section></main>
<footer><div class="shell">Unnatural Intelligence at SAIT · Questions? <a href="mailto:unnaturalintelligencesait@gmail.com">Email the club</a></div></footer>
<dialog id="details" aria-labelledby="detail-title"><button class="btn close" id="close" aria-label="Close event details">Close</button><div id="detail-body"></div></dialog>
<script>
(()=>{'use strict';let events=[],current=new Date(),view='calendar',lastFocused;current=new Date(current.getFullYear(),current.getMonth(),1);const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null;const d=new Date(s+'T12:00:00');return Number.isNaN(d.getTime())?null:d},long=d=>d.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'});const sorted=items=>items.slice().sort((a,b)=>`${a.date||'9999'} ${a.time||'99'}`.localeCompare(`${b.date||'9999'} ${b.time||'99'}`));
function button(ev){const b=document.createElement('button');b.type='button';b.className='event'+(ev.category==='pending'?' pending':'');const title=document.createElement('strong');title.textContent=ev.title||'Untitled event';b.append(title);const meta=document.createElement('small');meta.textContent=[ev.time||'Time to be announced',ev.category==='pending'?'Pending':null].filter(Boolean).join(' · ');b.append(meta);b.setAttribute('aria-label',`${ev.title||'Untitled event'}, ${parse(ev.date)?long(parse(ev.date)): 'date to be announced'}${ev.time?', '+ev.time:''}${ev.category==='pending'?', pending':''}`);b.addEventListener('click',()=>open(ev,b));return b}
function open(ev,trigger){lastFocused=trigger;const body=$('detail-body');body.replaceChildren();if(ev.category){const s=document.createElement('span');s.className='status';s.textContent=ev.category;body.append(s)}const h=document.createElement('h2');h.id='detail-title';h.textContent=ev.title||'Untitled event';body.append(h);const when=document.createElement('p');when.textContent=(parse(ev.date)?long(parse(ev.date)):'Date to be announced')+(ev.time?' at '+ev.time:' · Time to be announced');body.append(when);const loc=document.createElement('p');loc.textContent=ev.location||'Location to be announced';body.append(loc);if(ev.description){const p=document.createElement('p');p.textContent=ev.description;body.append(p)}if(Array.isArray(ev.media)&&ev.media.length){const media=document.createElement('div');media.className='media';ev.media.forEach(u=>{try{const url=new URL(u,location.href);if(!['http:','https:'].includes(url.protocol))return;const a=document.createElement('a');a.href=url.href;a.rel='noopener noreferrer';a.target='_blank';a.textContent='Open event attachment';media.append(a)}catch{}});body.append(media)}$('details').showModal()}
function render(){const month=current.getMonth(),year=current.getFullYear();$('month').textContent=current.toLocaleDateString('en-CA',{month:'long',year:'numeric'});const g=$('grid');g.replaceChildren();const start=new Date(year,month,1);start.setDate(1-(start.getDay()+6)%7);const now=iso(new Date());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),cell=document.createElement('div');cell.className='day'+(d.getMonth()!==month?' outside':'')+(key===now?' today':'');const n=document.createElement('span');n.className='day-num';n.textContent=d.getDate();n.setAttribute('aria-label',long(d));cell.append(n);sorted(events.filter(e=>e.date===key)).forEach(e=>cell.append(button(e)));g.append(cell)}const monthItems=sorted(events.filter(e=>{const d=parse(e.date);return d&&d.getMonth()===month&&d.getFullYear()===year}));const list=$('list');list.replaceChildren();if(!monthItems.length){const p=document.createElement('p');p.className='empty';p.textContent='No events on the calendar this month.';list.append(p)}monthItems.forEach(e=>{const row=document.createElement('div');row.className='list-row';const date=document.createElement('div');date.className='list-date';date.textContent=parse(e.date).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});row.append(date,button(e));list.append(row)});const undated=sorted(events.filter(e=>!parse(e.date)));$('tba').hidden=!undated.length;$('tba-list').replaceChildren(...undated.map(button));$('calendar').hidden=view!=='calendar';list.hidden=view!=='list';$('calendar-view').setAttribute('aria-pressed',String(view==='calendar'));$('list-view').setAttribute('aria-pressed',String(view==='list'))}
$('prev').onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()-1,1);render()};$('next').onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()+1,1);render()};$('today').onclick=()=>{const d=new Date();current=new Date(d.getFullYear(),d.getMonth(),1);render()};$('calendar-view').onclick=()=>{view='calendar';render()};$('list-view').onclick=()=>{view='list';render()};$('close').onclick=()=>$('details').close();$('details').addEventListener('close',()=>lastFocused?.focus());$('details').addEventListener('click',e=>{if(e.target===$('details'))$('details').close()});
async function load(){let data;try{let r;try{r=await fetch('events.json',{cache:'no-store'});if(!r.ok)throw Error('static')}catch{r=await fetch('/api/events',{cache:'no-store'});if(!r.ok)throw Error('api')}data=await r.json();events=Array.isArray(data)?data:data.events;if(!Array.isArray(events))throw Error('invalid data');$('error').hidden=true;render()}catch{$('error').textContent='Could not load the calendar. Please refresh to try again.';$('error').hidden=false}}render();load();setInterval(load,60000);
})();
</script></body></html>
