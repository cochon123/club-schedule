<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unnatural Intelligence — Schedule</title>
<style>
  :root {
    --bg: #0d0d12;
    --card: #16161e;
    --card-edge: #262633;
    --text: #e8e6f0;
    --dim: #8a87a0;
    --accent: #7c5cff;
    --accent-2: #4fd1c5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 2rem 1rem .8rem;
    text-align: center;
  }
  header h1 { margin: 0 0 .2rem; font-size: 1.6rem; letter-spacing: .02em; }
  header h1 .ui { color: var(--accent); }
  header p { margin: 0; color: var(--dim); font-size: .9rem; }

  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .8rem;
    margin: 1rem auto 1.2rem;
  }
  .week-nav button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    font-size: 1rem;
    padding: .4rem .9rem;
    cursor: pointer;
  }
  .week-nav button:hover { border-color: var(--accent); }
  .week-nav .label { min-width: 170px; text-align: center; font-weight: 600; font-size: .95rem; }
  .week-nav .today-btn { font-size: .82rem; color: var(--dim); }

  main { max-width: 1080px; margin: 0 auto; padding: 0 1rem 3rem; }

  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: .5rem;
  }
  .day {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    min-height: 120px;
    padding: .45rem;
    display: flex;
    flex-direction: column;
    gap: .4rem;
  }
  .day.other-month { opacity: .55; }
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .day .day-head { font-size: .74rem; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .day.today .day-head { color: var(--accent-2); }
  .day .day-num { font-size: .8rem; color: var(--dim); margin-top: -0.35rem; }

  .ev {
    background: rgba(124,92,255,.1);
    border: 1px solid rgba(124,92,255,.35);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: .35rem .45rem;
    cursor: pointer;
    font-size: .8rem;
    line-height: 1.25;
  }
  .ev:hover { background: rgba(124,92,255,.2); }
  .ev .t { font-weight: 600; }
  .ev .tm { color: var(--accent-2); font-size: .72rem; display: block; margin-top: .1rem; }
  .ev .cat { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-2); display: block; margin-top: .15rem; }
  .ev.past { opacity: .4; }

  .section-title {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--dim);
    margin: 1.6rem 0 .6rem;
  }
  .tba {
    background: var(--card);
    border: 1px dashed var(--card-edge);
    border-radius: 12px;
    padding: .7rem 1rem;
    font-size: .9rem;
    cursor: pointer;
    margin-bottom: .5rem;
  }
  .tba:hover { border-color: var(--accent); }

  .empty { text-align: center; color: var(--dim); padding: 2.5rem 1rem; }
  .empty .big { font-size: 2rem; margin-bottom: .4rem; }
  footer { text-align: center; color: var(--dim); font-size: .8rem; padding: 1rem; }

  /* popup */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5,5,10,.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 16px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 1.3rem 1.4rem;
    position: relative;
  }
  .modal .close {
    position: absolute;
    top: .7rem; right: .9rem;
    background: none;
    border: none;
    color: var(--dim);
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }
  .modal .close:hover { color: var(--text); }
  .modal .when {
    display: inline-block;
    font-size: .78rem;
    font-weight: 600;
    color: var(--accent-2);
    background: rgba(79,209,197,.08);
    border: 1px solid rgba(79,209,197,.25);
    border-radius: 999px;
    padding: .15rem .65rem;
    margin-bottom: .6rem;
  }
  .modal h2 { margin: .1rem 0 .6rem; font-size: 1.3rem; padding-right: 1.5rem; }
  .modal .meta { color: var(--dim); font-size: .92rem; margin: .2rem 0; }
  .modal .desc { margin: .8rem 0 0; font-size: .97rem; line-height: 1.55; white-space: pre-wrap; }
  .modal .media { margin-top: 1rem; display: flex; flex-direction: column; gap: .6rem; }
  .modal .media img { max-width: 100%; border-radius: 10px; border: 1px solid var(--card-edge); }
  .modal .media a {
    color: var(--accent);
    font-size: .9rem;
    word-break: break-all;
  }

  @media (max-width: 860px) {
    .week { grid-template-columns: 1fr; }
    .day { min-height: 0; }
    .day .day-num { display: inline; margin-left: .4rem; }
    .day .day-head, .day .day-num { display: inline-block; }
  }
</style>
</head>
<body>
<header>
  <h1>Unnatural <span class="ui">Intelligence</span></h1>
  <p>what's coming up · click an event for details</p>
</header>
<div class="week-nav">
  <button id="prev" aria-label="previous week">‹</button>
  <span class="label" id="week-label"></span>
  <button id="next" aria-label="next week">›</button>
  <button class="today-btn" id="today">this week</button>
</div>
<main>
  <div class="week" id="week"></div>
  <div id="tba-wrap" hidden>
    <div class="section-title">Date to be announced</div>
    <div id="tba-list"></div>
  </div>
  <div class="empty" id="empty" hidden>
    <div class="big">🫧</div>
    <p>Nothing scheduled this week.</p>
  </div>
</main>
<footer>served by Jelly 🐙 · updated live</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="close" id="close" aria-label="close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function () {
  const weekEl = document.getElementById('week');
  const labelEl = document.getElementById('week-label');
  const emptyEl = document.getElementById('empty');
  const tbaWrap = document.getElementById('tba-wrap');
  const tbaList = document.getElementById('tba-list');
  const overlay = document.getElementById('overlay');
  const modalBody = document.getElementById('modal-body');
  let events = [];
  let weekOffset = 0;

  function pad(n) { return String(n).padStart(2, '0'); }
  function isoLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayIso() { return isoLocal(new Date()); }
  function mondayOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - (x.getDay() + 6) % 7);
    return x;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

  function fmtDayHead(d) {
    return d.toLocaleDateString(undefined, { weekday: 'short' });
  }
  function fmtLong(iso) {
    if (!iso) return 'date to be announced';
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  async function loadData() {
    // GitHub Pages: static events.json (bare array). Local server: the API.
    try {
      const r1 = await fetch('events.json', { cache: 'no-store' });
      if (r1.ok) {
        const data = await r1.json();
        return Array.isArray(data) ? { events: data } : data;
      }
    } catch (e) { /* fall through */ }
    const r2 = await fetch('/api/events');
    return await r2.json();
  }

  function evCard(ev, past) {
    const el = document.createElement('div');
    el.className = 'ev' + (past ? ' past' : '');
    el.setAttribute('role', 'button');
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = ev.title;
    el.appendChild(t);
    if (ev.time) {
      const tm = document.createElement('span');
      tm.className = 'tm';
      tm.textContent = ev.time;
      el.appendChild(tm);
    }
    if (ev.category) {
      const cat = document.createElement('span');
      cat.className = 'cat';
      cat.textContent = ev.category;
      el.appendChild(cat);
    }
    el.addEventListener('click', () => openModal(ev));
    return el;
  }

  function render() {
    const start = addDays(mondayOf(new Date()), weekOffset * 7);
    const end = addDays(start, 6);
    const startTxt = start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const endTxt = end.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    labelEl.textContent = startTxt + ' – ' + endTxt + ', ' + end.getFullYear();

    const today = todayIso();
    const byDate = {};
    const tbas = [];
    events.forEach(ev => {
      if (!ev.date) { tbas.push(ev); return; }
      (byDate[ev.date] = byDate[ev.date] || []).push(ev);
    });

    weekEl.innerHTML = '';
    let weekHasEvents = false;
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      const iso = isoLocal(d);
      const cell = document.createElement('div');
      cell.className = 'day' + (iso === today ? ' today' : '');
      const head = document.createElement('div');
      head.className = 'day-head';
      head.textContent = fmtDayHead(d);
      cell.appendChild(head);
      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      cell.appendChild(num);
      const list = (byDate[iso] || []).sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1);
      list.forEach(ev => { cell.appendChild(evCard(ev, ev.date < today)); weekHasEvents = true; });
      weekEl.appendChild(cell);
    }

    tbaWrap.hidden = tbas.length === 0;
    tbaList.innerHTML = '';
    tbas.forEach(ev => {
      const el = document.createElement('div');
      el.className = 'tba';
      el.textContent = '🗓 ' + ev.title;
      el.addEventListener('click', () => openModal(ev));
      tbaList.appendChild(el);
    });

    emptyEl.hidden = weekHasEvents;
  }

  function openModal(ev) {
    modalBody.innerHTML = '';
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = fmtLong(ev.date) + (ev.time ? ' · ' + ev.time : '');
    modalBody.appendChild(when);
    const h = document.createElement('h2');
    h.textContent = ev.title;
    modalBody.appendChild(h);
    if (ev.location) {
      const loc = document.createElement('div');
      loc.className = 'meta';
      loc.textContent = '📍 ' + ev.location;
      modalBody.appendChild(loc);
    }
    if (ev.description) {
      const p = document.createElement('p');
      p.className = 'desc';
      p.textContent = ev.description;
      modalBody.appendChild(p);
    }
    if (ev.media && ev.media.length) {
      const wrap = document.createElement('div');
      wrap.className = 'media';
      ev.media.forEach(u => {
        if (/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(u)) {
          const img = document.createElement('img');
          img.src = u;
          img.alt = '';
          img.loading = 'lazy';
          wrap.appendChild(img);
        } else {
          const a = document.createElement('a');
          a.href = u;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = u;
          wrap.appendChild(a);
        }
      });
      modalBody.appendChild(wrap);
    }
    overlay.classList.add('open');
  }

  function closeModal() { overlay.classList.remove('open'); }
  document.getElementById('close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('prev').addEventListener('click', () => { weekOffset--; render(); });
  document.getElementById('next').addEventListener('click', () => { weekOffset++; render(); });
  document.getElementById('today').addEventListener('click', () => { weekOffset = 0; render(); });

  async function load() {
    try {
      const data = await loadData();
      events = (data.events || []).slice().sort((a, b) =>
        ((a.date || '9999') + (a.time || '')) < ((b.date || '9999') + (b.time || '')) ? -1 : 1);
      render();
    } catch (e) {
      emptyEl.hidden = false;
      emptyEl.querySelector('p').textContent = 'Could not load the schedule. Try refreshing.';
    }
  }

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
